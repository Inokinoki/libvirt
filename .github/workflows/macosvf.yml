name: macOS Virtualization.Framework Build and Test

on:
  push:
    branches:
      - master
      - macos-virtualization-frameworks
    paths:
      - 'src/macosvf/**'
      - 'tests/macosvf*'
      - '.github/workflows/macosvf.yml'
  pull_request:
    branches:
      - master
      - macos-virtualization-frameworks
    paths:
      - 'src/macosvf/**'
      - 'tests/macosvf*'
      - '.github/workflows/macosvf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test macOS Virtualization.Framework
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config
          brew install glib gnutls libxml2 readline xz libpcap
          brew install make gnu-sed grep

      - name: Configure build
        run: |
          meson setup builddir \
            -Ddriver_macosvf=enabled \
            -Ddriver_remote=enabled \
            -Ddriver_libvirtd=enabled \
            -Ddriver_test=enabled \
            -Dtests=enabled \
            -Doptimization=0 \
            -Ddocs=disabled \
            --prefix=/usr/local

      - name: Build
        run: |
          meson compile -C builddir -j"$(sysctl -n hw.logicalcpu)"

      - name: Run focused macOS Virtualization.Framework unit tests
        run: |
          meson test -C builddir \
            macosvfxml2xmltest \
            macosvfcapabilitiestest \
            macosvfdomainopstest \
            --no-rebuild \
            --print-errorlogs

      - name: virsh macosvf integration smoke test (aarch64 domain)
        env:
          LIBVIRT_DEFAULT_URI: macosvf:///session
        run: |
          set -euo pipefail

          cat > ci-macosvf-aarch64.xml <<'EOF'
          <domain type='macosvf'>
            <name>ci-macosvf-aarch64</name>
            <memory unit='KiB'>524288</memory>
            <currentMemory unit='KiB'>524288</currentMemory>
            <vcpu placement='static'>1</vcpu>
            <os>
              <type arch='aarch64' machine='macosvf'>hvm</type>
              <boot dev='hd'/>
            </os>
            <features>
              <acpi/>
            </features>
            <clock offset='utc'/>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
          </domain>
          EOF

          # Use meson devenv so libvirt libraries/drivers are found reliably.
          meson devenv -C builddir -- ./tools/virsh -c macosvf:///session uri
          meson devenv -C builddir -- ./tools/virsh -c macosvf:///session define ci-macosvf-aarch64.xml

          # The previous regression manifested during listing domains.
          meson devenv -C builddir -- ./tools/virsh -c macosvf:///session list --all

          meson devenv -C builddir -- ./tools/virsh -c macosvf:///session dominfo ci-macosvf-aarch64
          meson devenv -C builddir -- ./tools/virsh -c macosvf:///session undefine ci-macosvf-aarch64

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macosvf-ci-logs
          path: |
            builddir/meson-logs/testlog.txt
            builddir/meson-logs/meson-log.txt
          retention-days: 7
