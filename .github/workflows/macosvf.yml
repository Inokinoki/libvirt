name: macOS Virtualization.Framework Build and Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test macOS Virtualization.Framework
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config
          brew install glib gnutls libxml2 readline xz libpcap
          brew install make gnu-sed grep

      - name: Configure build
        run: |
          meson setup builddir \
            -Ddriver_macosvf=enabled \
            -Ddriver_remote=enabled \
            -Ddriver_libvirtd=enabled \
            -Ddriver_test=enabled \
            -Dtests=enabled \
            -Doptimization=0 \
            -Ddocs=disabled \
            --prefix=/usr/local

      - name: Build
        run: |
          meson compile -C builddir -j"$(sysctl -n hw.logicalcpu)"

      - name: Run focused macOS Virtualization.Framework unit tests
        run: |
          meson test -C builddir \
            macosvfxml2xmltest \
            macosvfcapabilitiestest \
            --no-rebuild \
            --print-errorlogs

      - name: virsh macosvf integration smoke test (aarch64 domain)
        working-directory: builddir
        env:
          LIBVIRT_DEFAULT_URI: macosvf:///session
          LIBVIRT_DEBUG: 1
        run: |
          set -euo pipefail

          echo "cwd: $(pwd)"
          ls -ld . ./tools ./src 2>/dev/null || true

          virsh_cmd=(meson devenv ./tools/virsh -c macosvf:///session)
          domain_name="ci-macosvf-aarch64-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          domain_uuid="$(uuidgen | tr '[:upper:]' '[:lower:]')"

          run_with_timeout() {
            local seconds="$1"
            shift

            "$@" &
            local cmd_pid=$!

            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                echo "Timed out after ${seconds}s: $*" >&2
                kill "$cmd_pid" 2>/dev/null || true
              fi
            ) &
            local watcher_pid=$!

            local rc=0
            wait "$cmd_pid" || rc=$?

            kill "$watcher_pid" 2>/dev/null || true
            wait "$watcher_pid" 2>/dev/null || true

            if [ "$rc" -eq 143 ]; then
              return 124
            fi

            return "$rc"
          }

          cleanup() {
            "${virsh_cmd[@]}" undefine "$domain_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          domain_xml="ci-macosvf-aarch64.xml"
          cat > "$domain_xml" <<EOF
          <domain type='macosvf'>
            <name>${domain_name}</name>
            <uuid>${domain_uuid}</uuid>
            <memory unit='KiB'>524288</memory>
            <currentMemory unit='KiB'>524288</currentMemory>
            <vcpu placement='static'>1</vcpu>
            <os>
              <type arch='aarch64' machine='macosvf'>hvm</type>
              <boot dev='hd'/>
            </os>
            <features>
              <acpi/>
            </features>
            <cpu mode='host-model'/>
            <clock offset='utc'/>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>restart</on_crash>
            <devices>
              <controller type='pci' index='0' model='pci-root'/>
              <controller type='isa' index='0'/>
              <serial type='pty'>
                <target port='0'/>
              </serial>
              <console type='pty'>
                <target type='serial' port='0'/>
              </console>
            </devices>
          </domain>
          EOF

          # Use meson devenv so libvirt libraries/drivers are found reliably.
          ls -l "$domain_xml"
          "${virsh_cmd[@]}" --version
          "${virsh_cmd[@]}" uri
          "${virsh_cmd[@]}" undefine "$domain_name" >/dev/null 2>&1 || true
          run_with_timeout 30 "${virsh_cmd[@]}" define "$domain_xml"

          # The previous regression manifested during listing domains.
          run_with_timeout 30 "${virsh_cmd[@]}" list --all

          run_with_timeout 30 "${virsh_cmd[@]}" dominfo "$domain_name"
          "${virsh_cmd[@]}" undefine "$domain_name"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macosvf-ci-logs
          path: |
            builddir/meson-logs/testlog.txt
            builddir/meson-logs/meson-log.txt
          retention-days: 7
