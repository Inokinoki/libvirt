name: macOS Virtualization.Framework Build and Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test macOS Virtualization.Framework
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config
          brew install glib gnutls libxml2 readline xz libpcap
          brew install make gnu-sed grep

      - name: Configure build
        run: |
          meson setup builddir \
            -Ddriver_macosvf=enabled \
            -Ddriver_remote=enabled \
            -Ddriver_libvirtd=enabled \
            -Ddriver_test=enabled \
            -Dtests=enabled \
            -Doptimization=0 \
            -Ddocs=disabled \
            --prefix=/usr/local

      - name: Build
        run: |
          meson compile -C builddir -j"$(sysctl -n hw.logicalcpu)"

      - name: Run focused macOS Virtualization.Framework unit tests
        run: |
          meson test -C builddir \
            macosvfxml2xmltest \
            macosvfcapabilitiestest \
            --no-rebuild \
            --print-errorlogs

      - name: virsh macosvf integration smoke test (aarch64 domain)
        env:
          LIBVIRT_DEFAULT_URI: macosvf:///session
          LIBVIRT_DEBUG: 1
        run: |
          set -euo pipefail

          virsh_devenv() {
            meson devenv -C builddir ./tools/virsh -c macosvf:///session "$@"
          }

          run_with_timeout() {
            local seconds="$1"
            shift

            "$@" &
            local cmd_pid=$!

            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                echo "Timed out after ${seconds}s: $*" >&2
                kill "$cmd_pid" 2>/dev/null || true
              fi
            ) &
            local watcher_pid=$!

            local rc=0
            if ! wait "$cmd_pid"; then
              rc=$?
            fi

            kill "$watcher_pid" 2>/dev/null || true
            wait "$watcher_pid" 2>/dev/null || true

            if [ "$rc" -eq 143 ]; then
              return 124
            fi

            return "$rc"
          }

          cleanup() {
            virsh_devenv undefine ci-macosvf-aarch64 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          domain_xml="$PWD/ci-macosvf-aarch64.xml"
          cat > "$domain_xml" <<'EOF'
          <domain type='macosvf'>
            <name>ci-macosvf-aarch64</name>
            <memory unit='KiB'>524288</memory>
            <currentMemory unit='KiB'>524288</currentMemory>
            <vcpu placement='static'>1</vcpu>
            <os>
              <type arch='aarch64' machine='macosvf'>hvm</type>
              <boot dev='hd'/>
            </os>
            <features>
              <acpi/>
            </features>
            <clock offset='utc'/>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
          </domain>
          EOF

          # Use meson devenv so libvirt libraries/drivers are found reliably.
          virsh_devenv --version
          virsh_devenv uri
          virsh_devenv define "$domain_xml"

          # The previous regression manifested during listing domains.
          run_with_timeout 30 virsh_devenv list --all

          run_with_timeout 30 virsh_devenv dominfo ci-macosvf-aarch64
          virsh_devenv undefine ci-macosvf-aarch64

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macosvf-ci-logs
          path: |
            builddir/meson-logs/testlog.txt
            builddir/meson-logs/meson-log.txt
          retention-days: 7
